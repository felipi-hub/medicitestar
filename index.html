<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" />
    <title>MediIA Pro — Telemedicina com IA e Anatomia 3D</title>
    <meta name="description"
        content="Plataforma completa de telemedicina em um único arquivo HTML: IndexedDB, assistente de IA, teleconsulta e estúdio de anatomia 3D." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
                    colors: {
                        // Paleta médica — teal hospitalar
                        med: {
                            50: "#f0fdfa", 100: "#ccfbf1", 200: "#99f6e4", 300: "#5eead4",
                            400: "#2dd4bf", 500: "#14b8a6", 600: "#0d9488", 700: "#0f766e",
                            800: "#115e59", 900: "#134e4a", 950: "#042f2e",
                        },
                    },
                },
            },
        };
    </script>

    <!-- Three.js via import map -->
    <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

    <style>
        html {
            scroll-behavior: smooth;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 8px;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }

        .fade-in {
            animation: fadeIn .25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        /* Etiquetas do 3D (temáticas) */
        .hotspot {
            position: absolute;
            transform: translate(-50%, -100%);
            pointer-events: auto;
            cursor: pointer;
            background: rgba(255, 255, 255, .94);
            color: #0f172a;
            font-size: 10px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 8px;
            border: 1px solid rgba(13, 148, 136, .45);
            white-space: nowrap;
            backdrop-filter: blur(4px);
            transition: background .15s, color .15s;
        }

        .hotspot:hover,
        .hotspot.active {
            background: #0d9488;
            color: #fff;
            border-color: #14b8a6;
        }

        .dark .hotspot {
            background: rgba(8, 15, 30, .88);
            color: #ccfbf1;
            border-color: rgba(45, 212, 191, .45);
        }

        .dark .hotspot:hover,
        .dark .hotspot.active {
            background: #0f766e;
            color: #fff;
        }

        .range-med {
            accent-color: #0d9488;
        }

        /* Mobile: toque sem atraso nem flash azul; sliders mais fáceis de pegar */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        button,
        a,
        input,
        select,
        textarea,
        label {
            touch-action: manipulation;
        }

        input[type="range"] {
            height: 28px;
        }

        @media (max-width: 640px) {
            .hotspot {
                font-size: 9px;
                padding: 4px 7px;
            }
        }

        /* Safe area (iPhone com notch) */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">

    <div id="app">
        <div class="flex min-h-screen items-center justify-center">
            <p class="text-sm text-slate-400">Carregando a plataforma…</p>
        </div>
    </div>
    <div id="toast-root"
        class="pointer-events-none fixed bottom-24 left-4 right-4 z-[100] flex flex-col items-end gap-2 md:bottom-4 md:left-auto">
    </div>

    <script type="module">

            lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',

            lungs: '<path d="M12 3v6"/><path d="M10 9c0-1.8-1.5-3-3.2-3C4 6 3 12 3 16c0 2 1.3 3 2.8 3S10 18 10 15.5V9Z"/><path d="M14 9c0-1.8 1.5-3 3.2-3C20 6 21 12 21 16c0 2-1.3 3-2.8 3S14 18 14 15.5V9Z"/>',
            bone: '<path d="M17 10c.7-.7 1.7 0 2.5 0a2.5 2.5 0 1 0 0-5 .5.5 0 0 1-.5-.5 2.5 2.5 0 1 0-5 0c0 .8.7 1.8 0 2.5l-7 7c-.7.7-1.7 0-2.5 0a2.5 2.5 0 0 0 0 5c.3 0 .5.2.5.5a2.5 2.5 0 1 0 5 0c0-.8-.7-1.8 0-2.5Z"/>',
            send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
            sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>',
            moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',

            chat: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
            scan: '<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/>',
            layers: '<path d="m12 2 8.5 4.5L12 11 3.5 6.5 12 2Z"/><path d="m3.5 11.5 8.5 4.5 8.5-4.5"/><path d="m3.5 16.5 8.5 4.5 8.5-4.5"/>',
            rotate: '<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/>',

            target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',

            save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
            pen: '<path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
            pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
            zap: '<path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/>',
            smile: '<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/>',
            flower: '<circle cx="12" cy="12" r="3"/><path d="M12 9a3 3 0 1 0-3 3M12 9a3 3 0 1 1 3 3M12 15a3 3 0 1 0 3-3M12 15a3 3 0 1 1-3-3"/>',
            clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
            search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',

        };
        const ic = (name, cls = "h-4 w-4") =>
            `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls} shrink-0" aria-hidden="true">${ICONS[name] || ICONS.circle}</svg>`;

        const SPEC_ICON = { "Clínica Geral": "steth", "Cardiologia": "heartPulse", "Dermatologia": "sparkles", "Pediatria": "smile", "Psiquiatria": "brain", "Neurologia": "zap", "Gastroenterologia": "flask", "Ortopedia": "bone", "Ginecologia": "flower" };
        const specIcon = (name, cls = "h-5 w-5") => ic(SPEC_ICON[name] || "steth", cls);
        const DOC_ICON = { receita: "pill", atestado: "clipboard", exame: "flask" };

        const logoHTML = (textCls = "text-slate-900 dark:text-white") => `
  <span class="inline-flex items-center gap-2.5">
    <span class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-med-500 to-med-700 text-white shadow-sm">${ic("plus", "h-5 w-5")}</span>
    <span class="text-xl font-bold ${textCls}">Medi<span class="text-med-500">IA</span></span>
  </span>`;

        /* ═══ 1. TEMA (claro/escuro) ═════════════════════════════════════════ */
        const THEME_KEY = "mediia_theme";
        const isDark = () => document.documentElement.classList.contains("dark");
        function applyTheme(t) {
            document.documentElement.classList.toggle("dark", t === "dark");
            localStorage.setItem(THEME_KEY, t);
            window.dispatchEvent(new CustomEvent("mediia-theme", { detail: t }));
        }
        applyTheme(localStorage.getItem(THEME_KEY) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

        const themeBtnHTML = () =>
            `<button data-theme-toggle class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-white text-slate-600 shadow-sm ring-1 ring-slate-200 transition hover:bg-slate-100 dark:bg-slate-800 dark:text-slate-300 dark:ring-slate-700 dark:hover:bg-slate-700" title="Alternar tema claro/escuro" aria-label="Alternar tema">${ic(isDark() ? "sun" : "moon")}</button>`;
        function bindTheme(root) {
            root.querySelectorAll("[data-theme-toggle]").forEach((b) =>
                b.addEventListener("click", () => {
                    applyTheme(isDark() ? "light" : "dark");
                    root.querySelectorAll("[data-theme-toggle]").forEach((x) => (x.innerHTML = ic(isDark() ? "sun" : "moon")));
                })
            );
        }

        /* ═══ 2. DESIGN TOKENS (padrão de cores médico) ══════════════════════ */
        const C = {
            card: "rounded-2xl bg-white shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800",
            h: "text-slate-900 dark:text-white",
            t: "text-slate-600 dark:text-slate-300",
            tm: "text-slate-500 dark:text-slate-400",
            tf: "text-slate-400 dark:text-slate-500",
            soft: "bg-slate-50 dark:bg-slate-800/60",
            input: "mt-1 w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-base text-slate-900 outline-none transition focus:border-med-500 focus:ring-2 focus:ring-med-100 dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:focus:border-med-500 dark:focus:ring-med-900/40 sm:text-sm",
            btnP: "inline-flex items-center justify-center gap-2 rounded-xl bg-med-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-med-700 disabled:opacity-40",
            btnSec: "inline-flex items-center justify-center gap-2 rounded-xl bg-slate-100 px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700",
            btnDanger: "inline-flex items-center justify-center gap-1.5 rounded-lg border border-rose-200 px-3 py-1.5 text-xs font-semibold text-rose-600 transition hover:bg-rose-50 dark:border-rose-900 dark:text-rose-400 dark:hover:bg-rose-950/40",
            chipP: "inline-flex items-center gap-1.5 rounded-lg bg-med-600 px-3 py-1.5 text-xs font-semibold text-white transition hover:bg-med-700",
            chipSec: "inline-flex items-center gap-1.5 rounded-lg bg-slate-700 px-3 py-1.5 text-xs font-semibold text-white transition hover:bg-slate-600",
            link: "font-semibold text-med-600 hover:underline dark:text-med-400",
        };

        /* ═══ 3. UTILS ═══════════════════════════════════════════════════════ */
        const fmtBRL = (c) => (c / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
        const fmtDT = (d) => new Date(d).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
        const nowISO = () => new Date().toISOString();
        const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        const STATUS_LABELS = { solicitado: "Solicitado", confirmado: "Confirmado", em_atendimento: "Em atendimento", concluido: "Concluído", cancelado: "Cancelado", nao_compareceu: "Não compareceu" };
        const STATUS_COLORS = {
            solicitado: "bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300",
            confirmado: "bg-emerald-100 text-emerald-800 dark:bg-emerald-500/15 dark:text-emerald-300",
            em_atendimento: "bg-sky-100 text-sky-800 dark:bg-sky-500/15 dark:text-sky-300",
            concluido: "bg-slate-200 text-slate-700 dark:bg-slate-700 dark:text-slate-300",
            cancelado: "bg-rose-100 text-rose-800 dark:bg-rose-500/15 dark:text-rose-300",
            nao_compareceu: "bg-orange-100 text-orange-800 dark:bg-orange-500/15 dark:text-orange-300",
        };
        const statusBadge = (s) => `<span class="rounded-full px-2.5 py-1 text-xs font-medium ${STATUS_COLORS[s] || "bg-slate-200"}">${STATUS_LABELS[s] || s}</span>`;

        function genDocCode() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            let code = "MED-";
            for (let i = 0; i < 10; i++) { code += chars[Math.floor(Math.random() * chars.length)]; if (i === 4) code += "-"; }
            return code;
        }
        function toast(message, type = "info") {
            const root = document.getElementById("toast-root");
            const colors = { info: "bg-slate-800 text-white", success: "bg-med-600 text-white", error: "bg-rose-600 text-white", warn: "bg-amber-500 text-slate-900" };
            const el = document.createElement("div");
            el.className = `fade-in pointer-events-auto max-w-xs rounded-xl px-4 py-3 text-sm font-medium shadow-lg ${colors[type] || colors.info}`;
            el.textContent = message;
            root.appendChild(el);
            setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; setTimeout(() => el.remove(), 300); }, 3500);
        }

        /* ═══ 4. BANCO DE DADOS (IndexedDB) ══════════════════════════════════ */
        const DB_NAME = "mediia_db", DB_VERSION = 1;
        const DB_SCHEMA = {
            users: ["email:unique", "role"], healthProfiles: ["userId:unique"], specialties: [],
            doctors: ["userId:unique", "specialtyId"], availability: ["doctorId"],
            appointments: ["patientId", "doctorId"], records: ["appointmentId:unique"],
            documents: ["patientId", "code:unique", "appointmentId"], payments: ["patientId", "appointmentId"],
            notifications: ["userId"], aiMessages: ["userId"], roomMessages: ["appointmentId"], audit: [],
        };
        let _dbPromise = null;
        function openDB() {
            if (_dbPromise) return _dbPromise;
            _dbPromise = new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    for (const [name, indexes] of Object.entries(DB_SCHEMA)) {
                        if (!db.objectStoreNames.contains(name)) {
                            const store = db.createObjectStore(name, { keyPath: "id", autoIncrement: true });
                            for (const spec of indexes) {

                req.onerror = () => reject(req.error);

            const bellBtn = root.querySelector("#bell-btn"), badge = root.querySelector("#bell-badge"), panel = root.querySelector("#bell-panel");
            if (!bellBtn) return;
            const items = (await dbAllBy("notifications", "userId", user.id)).sort((a, b) => b.createdAt.localeCompare(a.createdAt));

            if (unread.length) { badge.textContent = unread.length; badge.classList.remove("hidden"); badge.classList.add("flex"); }
            bellBtn.addEventListener("click", async () => {
                panel.classList.toggle("hidden");
                if (!panel.classList.contains("hidden")) {
                    panel.innerHTML = `<p class="px-2 py-1 text-xs font-semibold uppercase tracking-wide ${C.tf}">Notificações</p>` +
                        (items.length === 0 ? `<p class="px-2 py-4 text-sm ${C.tm}">Nenhuma notificação.</p>`
                            : items.slice(0, 20).map((n) => `<div class="rounded-lg px-2 py-2 hover:bg-slate-50 dark:hover:bg-slate-800">

              <p class="mt-0.5 text-[10px] ${C.tf}">${fmtDT(n.createdAt)}</p></div>`).join(""));
                    for (const n of unread) await dbUpdate("notifications", n.id, { read: true });
                    badge.classList.add("hidden");
                }
            });
        }

        /* ═══ 9. ESTÚDIO 3D ══════════════════════════════════════════════════ */
        async function mountAnatomyPro(container, { compact = false, onAnnounce, forceDark = false } = {}) {

          <button data-t="rotate" data-on="1" class="inline-flex items-center gap-1 rounded-lg bg-med-600 px-2.5 py-1.5 text-[11px] font-semibold text-white">${ic("rotate", "h-3 w-3")} Girar</button>

            const mount = container.querySelector("[data-canvas]");
            const labelLayer = container.querySelector("[data-labels]");
            const infoBox = container.querySelector("[data-info]");
            const sceneDark = () => forceDark || isDark();

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(mount.clientWidth, mount.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;

            const scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x0a1120, 9, 20);
            const pmrem = new THREE.PMREMGenerator(renderer);
            scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

            const camera = new THREE.PerspectiveCamera(42, mount.clientWidth / mount.clientHeight, 0.1, 60);
            const HOME = new THREE.Vector3(2.6, 1.6, 4.2);
            camera.position.copy(HOME);

            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 0.55, 0);
            controls.minDistance = 1.6;

            controls.autoRotate = true;

            const keyLight = new THREE.DirectionalLight(0xfff2e6, 2.4);

            keyLight.shadow.camera.left = -4; keyLight.shadow.camera.right = 4;
            keyLight.shadow.camera.top = 5; keyLight.shadow.camera.bottom = -3;
            scene.add(keyLight);
            const rimA = new THREE.DirectionalLight(0x2dd4bf, 1.0); rimA.position.set(-6, 3, -4); scene.add(rimA);
            const rimB = new THREE.DirectionalLight(0x38bdf8, 0.55); rimB.position.set(2, -2, -6); scene.add(rimB);
            scene.add(new THREE.AmbientLight(0x334155, 0.6));

            const ground = new THREE.Mesh(new THREE.CircleGeometry(4.6, 72), new THREE.MeshStandardMaterial({ color: 0x101a2e, roughness: 0.85, metalness: 0.15 }));
            ground.rotation.x = -Math.PI / 2; ground.position.y = -1.42; ground.receiveShadow = true;
            scene.add(ground);
            const grid = new THREE.PolarGridHelper(4.6, 16, 7, 72, 0x1e3a5f, 0x16263f);
            grid.position.y = -1.415; scene.add(grid);
            const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.7, 0.12, 64), new THREE.MeshPhysicalMaterial({ color: 0x1b2a44, roughness: 0.3, metalness: 0.6, clearcoat: 0.8 }));
            pedestal.position.y = -1.36; pedestal.receiveShadow = true; pedestal.castShadow = true;
            scene.add(pedestal);

            // Fundo do estúdio acompanha o tema
            function applySceneTheme() {
                const d = sceneDark();
                const bg = d ? 0x0a1120 : 0xe4ebf3;
                scene.background = new THREE.Color(bg);
                scene.fog.color.set(bg);
                ground.material.color.set(d ? 0x101a2e : 0xc9d6e4);
                pedestal.material.color.set(d ? 0x1b2a44 : 0x9fb3c8);
                grid.visible = d;
            }
            applySceneTheme();
            window.addEventListener("mediia-theme", applySceneTheme);

            const clipPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 1.4);

            const M = {
                muscle: (c = 0xa31d3a) => new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.38, metalness: 0.02, clearcoat: 0.55, clearcoatRoughness: 0.35, sheen: 0.4, sheenColor: new THREE.Color(0xff8899), side: THREE.DoubleSide, clippingPlanes: [clipPlane] }),
                vesselA: () => new THREE.MeshPhysicalMaterial({ color: 0xd64545, roughness: 0.32, clearcoat: 0.7, clearcoatRoughness: 0.25, side: THREE.DoubleSide, clippingPlanes: [clipPlane] }),
                vesselV: () => new THREE.MeshPhysicalMaterial({ color: 0x3d5aa8, roughness: 0.32, clearcoat: 0.7, clearcoatRoughness: 0.25, side: THREE.DoubleSide, clippingPlanes: [clipPlane] }),
                brain: (c = 0xd9909f) => new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.62, clearcoat: 0.35, clearcoatRoughness: 0.5, sheen: 0.5, sheenColor: new THREE.Color(0xffc0cb), side: THREE.DoubleSide, clippingPlanes: [clipPlane] }),
                lung: () => new THREE.MeshPhysicalMaterial({ color: 0xd97983, roughness: 0.45, clearcoat: 0.4, transparent: true, opacity: 0.52, depthWrite: false, side: THREE.DoubleSide, clippingPlanes: [clipPlane] }),
                cart: () => new THREE.MeshPhysicalMaterial({ color: 0xe8ddc8, roughness: 0.5, clearcoat: 0.3, side: THREE.DoubleSide, clippingPlanes: [clipPlane] }),
                bone: () => new THREE.MeshPhysicalMaterial({ color: 0xe9e4d8, roughness: 0.48, metalness: 0.02, clearcoat: 0.25, clearcoatRoughness: 0.5, side: THREE.DoubleSide, clippingPlanes: [clipPlane] }),
            };

            function organicNoise(geo, amp = 0.05, f = [5.1, 4.3, 6.2]) {
                const pos = geo.attributes.position;
                const v = new THREE.Vector3();
                for (let i = 0; i < pos.count; i++) {
                    v.fromBufferAttribute(pos, i);
                    const n = Math.sin(v.x * f[0] + 1.3) * Math.sin(v.y * f[1] + 2.1) * Math.sin(v.z * f[2] + 0.7)
                        + 0.5 * Math.sin(v.x * f[0] * 2.3) * Math.sin(v.z * f[2] * 1.9);
                    const d = 1 + amp * n;
                    pos.setXYZ(i, v.x * d, v.y * d, v.z * d);
                }
                geo.computeVertexNormals();
                return geo;
            }
            function gyriNoise(geo, amp = 0.045) {
                const pos = geo.attributes.position;
                const v = new THREE.Vector3();
                for (let i = 0; i < pos.count; i++) {
                    v.fromBufferAttribute(pos, i);
                    const n = Math.sin(v.x * 14 + v.y * 3) * Math.sin(v.y * 11 + v.z * 5) * Math.sin(v.z * 13 + v.x * 7);
                    const d = 1 + amp * n;
                    pos.setXYZ(i, v.x * d, v.y * d, v.z * d);
                }
                geo.computeVertexNormals();
                return geo;
            }
            const tube = (points, radius, material, segs = 48) =>
                new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(...p))), segs, radius, 14, false), material);

            const group = new THREE.Group();
            scene.add(group);
            let parts = [];

            function addPart(mesh, name, desc, labelOffset = [0, 0.25, 0], explodeDir = null) {
                mesh.castShadow = true;
                mesh.traverse?.((o) => { if (o.isMesh) o.castShadow = true; });
                group.add(mesh);
                const base = mesh.position.clone();
                const dir = explodeDir ? new THREE.Vector3(...explodeDir) : base.clone().setY(base.y * 0.4).normalize();
                if (!dir.lengthSq()) dir.set(0, 1, 0);
                parts.push({ mesh, name, desc, base, dir, labelOffset: new THREE.Vector3(...labelOffset) });
                return mesh;
            }

            function buildHeart() {
                const lv = organicNoise(new THREE.SphereGeometry(0.72, 64, 48), 0.035);
                {
                    const p = lv.attributes.position, v = new THREE.Vector3();
                    for (let i = 0; i < p.count; i++) {
                        v.fromBufferAttribute(p, i);
                        if (v.y < 0) { const t = 1 + v.y * 0.42; p.setXYZ(i, v.x * t, v.y * 1.18, v.z * t); }
                    }
                    lv.computeVertexNormals();
                }
                const myo = new THREE.Mesh(lv, M.muscle());
                myo.scale.set(1, 1.18, 0.92); myo.rotation.z = -0.3; myo.rotation.y = 0.25; myo.position.set(0.05, -0.12, 0);
                addPart(myo, "Miocárdio (ventrículos)", "Parede muscular que bombeia o sangue. O ventrículo esquerdo impulsiona sangue oxigenado para o corpo todo com pressão de aproximadamente 120 mmHg.", [0.1, -0.75, 0.45], [0, -1, 0.3]);

                const ra = new THREE.Mesh(organicNoise(new THREE.SphereGeometry(0.36, 48, 36), 0.05), M.muscle(0x8d2440));
                ra.position.set(-0.52, 0.5, 0.02); ra.scale.set(1, 0.9, 0.95);
                addPart(ra, "Átrio direito", "Recebe sangue venoso (pobre em oxigênio) das veias cavas e o envia ao ventrículo direito.", [-0.4, 0.3, 0], [-1, 0.5, 0]);

                const la = new THREE.Mesh(organicNoise(new THREE.SphereGeometry(0.34, 48, 36), 0.05), M.muscle(0x8d2440));
                la.position.set(0.42, 0.56, -0.18); la.scale.set(1, 0.88, 0.95);
                addPart(la, "Átrio esquerdo", "Recebe sangue oxigenado das veias pulmonares e o envia ao ventrículo esquerdo.", [0.4, 0.3, 0], [1, 0.5, -0.3]);

                const aorta = tube([[0.18, 0.55, -0.05], [0.12, 1.05, -0.02], [-0.12, 1.3, -0.08], [-0.48, 1.18, -0.12], [-0.6, 0.78, -0.15]], 0.145, M.vesselA());
                addPart(aorta, "Aorta", "A maior artéria do corpo (cerca de 2,5 cm de diâmetro). Forma o arco aórtico e distribui sangue oxigenado para todos os órgãos.", [-0.1, 1.55, 0], [0, 1, 0]);

                const pulm = tube([[-0.12, 0.42, 0.18], [-0.05, 0.85, 0.3], [0.25, 1.05, 0.32]], 0.12, M.vesselV());
                addPart(pulm, "Tronco pulmonar", "Leva sangue venoso do ventrículo direito aos pulmões para oxigenação — única artéria que carrega sangue pobre em O2.", [0.4, 1.1, 0.35], [0.6, 0.8, 0.6]);

                const cava = tube([[-0.55, 1.25, 0.05], [-0.56, 0.9, 0.04], [-0.52, 0.62, 0.03]], 0.11, M.vesselV());
                addPart(cava, "Veia cava superior", "Devolve ao átrio direito o sangue venoso da cabeça e dos membros superiores.", [-0.85, 1.2, 0], [-0.8, 0.9, 0]);

                const cor1 = tube([[0.28, 0.32, 0.52], [0.05, 0.05, 0.68], [-0.18, -0.35, 0.6], [-0.22, -0.68, 0.38]], 0.028, M.vesselA());
                const cor2 = tube([[0.55, 0.28, 0.2], [0.68, -0.05, 0.1], [0.52, -0.45, 0.15]], 0.026, M.vesselA());
                const coronary = new THREE.Group(); coronary.add(cor1, cor2);
                addPart(coronary, "Artérias coronárias", "Irrigam o próprio músculo cardíaco. A obstrução delas causa o infarto — por isso são alvo de cateterismo e pontes de safena.", [0, -0.3, 0.8], [0.3, -0.3, 1]);

                return { camY: 0.45, scale: 1.15 };
            }

            function buildBrain() {
                const hemiG = gyriNoise(new THREE.SphereGeometry(0.62, 96, 72), 0.05);
                const hl = new THREE.Mesh(hemiG, M.brain());
                hl.scale.set(0.72, 0.92, 1.18); hl.position.set(-0.34, 0.55, 0);
                addPart(hl, "Hemisfério esquerdo", "Processa linguagem, lógica e o controle motor do lado direito do corpo. A superfície enrugada (giros e sulcos) amplia a área do córtex.", [-0.6, 0.75, 0], [-1, 0.3, 0]);
                const hr = new THREE.Mesh(hemiG.clone(), M.brain());
                hr.scale.set(0.72, 0.92, 1.18); hr.position.set(0.34, 0.55, 0);
                addPart(hr, "Hemisfério direito", "Associado a criatividade, noção espacial e controle motor do lado esquerdo. Conectado ao esquerdo pelo corpo caloso.", [0.6, 0.75, 0], [1, 0.3, 0]);

                const cb = new THREE.Mesh(gyriNoise(new THREE.SphereGeometry(0.36, 72, 56), 0.07), M.brain(0xc47a8c));
                cb.scale.set(1.15, 0.62, 0.85); cb.position.set(0, 0.02, -0.52);
                addPart(cb, "Cerebelo", "Coordena equilíbrio, postura e a precisão dos movimentos. Contém mais da metade dos neurônios do encéfalo.", [0, -0.35, -0.8], [0, -0.5, -1]);

                const bs = tube([[0, 0.3, -0.25], [0, 0.0, -0.3], [0.02, -0.4, -0.22], [0.03, -0.75, -0.12]], 0.14, M.brain(0xe3b6a6));
                addPart(bs, "Tronco encefálico", "Controla funções vitais automáticas: respiração, batimentos e pressão arterial. Conecta o cérebro à medula espinhal.", [0.35, -0.6, -0.1], [0.3, -1, 0]);

                return { camY: 0.4, scale: 1.25 };
            }

            function buildLungs() {
                const mkLung = () => {
                    const g = organicNoise(new THREE.SphereGeometry(0.62, 64, 48), 0.04);
                    const p = g.attributes.position, v = new THREE.Vector3();
                    for (let i = 0; i < p.count; i++) {
                        v.fromBufferAttribute(p, i);
                        if (v.y > 0) { const t = 1 - v.y * 0.35; p.setXYZ(i, v.x * t, v.y, v.z * t); }
                    }
                    g.computeVertexNormals();
                    return new THREE.Mesh(g, M.lung());
                };
                const right = mkLung(); right.scale.set(0.78, 1.5, 0.9); right.position.set(-0.72, 0.3, 0);
                addPart(right, "Pulmão direito", "Possui 3 lobos. Realiza a troca gasosa em cerca de 300 milhões de alvéolos, cuja área somada equivale a uma quadra de tênis.", [-1.15, 0.9, 0], [-1, 0.2, 0]);
                const left = mkLung(); left.scale.set(0.68, 1.45, 0.88); left.position.set(0.72, 0.28, 0);
                addPart(left, "Pulmão esquerdo", "Possui 2 lobos e a incisura cardíaca — o espaço que acomoda o coração. Levemente menor que o direito.", [1.15, 0.9, 0], [1, 0.2, 0]);

                const trachea = tube([[0, 1.75, 0], [0, 1.35, 0], [0, 1.05, 0]], 0.13, M.cart());
                const rings = new THREE.Group();
                for (let i = 0; i < 6; i++) {
                    const r = new THREE.Mesh(new THREE.TorusGeometry(0.135, 0.022, 10, 28), M.cart());
                    r.rotation.x = Math.PI / 2; r.position.set(0, 1.68 - i * 0.12, 0);
                    rings.add(r);
                }
                const tGroup = new THREE.Group(); tGroup.add(trachea, rings);
                addPart(tGroup, "Traqueia", "Tubo de cerca de 12 cm reforçado por anéis de cartilagem em C, que o mantêm sempre aberto para a passagem do ar.", [0.45, 1.6, 0], [0, 1, 0]);

                const bronchi = new THREE.Group();
                function branch(from, dir, len, radius, depth) {
                    const to = from.clone().addScaledVector(dir, len);
                    bronchi.add(tube([from.toArray(), from.clone().addScaledVector(dir, len * 0.55).toArray(), to.toArray()], radius, M.cart(), 20));
                    if (depth === 0) return;
                    for (let i = 0; i < 2; i++) {
                        const nd = dir.clone()
                            .applyAxisAngle(new THREE.Vector3(0, 0, 1), (i ? 1 : -1) * (0.55 + Math.random() * 0.2))
                            .applyAxisAngle(new THREE.Vector3(1, 0, 0), (Math.random() - 0.5) * 0.7)
                            .normalize();
                        branch(to, nd, len * 0.62, radius * 0.6, depth - 1);
                    }
                }
                branch(new THREE.Vector3(0, 1.05, 0), new THREE.Vector3(-0.72, -0.6, 0).normalize(), 0.5, 0.085, 3);
                branch(new THREE.Vector3(0, 1.05, 0), new THREE.Vector3(0.72, -0.55, 0).normalize(), 0.48, 0.08, 3);
                addPart(bronchi, "Árvore brônquica", "Os brônquios se ramificam cerca de 23 vezes até os bronquíolos e alvéolos — visível aqui através dos pulmões translúcidos.", [0, 0.1, 0.7], [0, -0.6, 0.8]);

                return { camY: 0.6, scale: 1.1 };
            }

            function buildThorax() {
                const spineGroup = new THREE.Group();
                for (let i = 0; i < 13; i++) {
                    const vert = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.09, 18), M.bone());
                    vert.position.set(0, 1.45 - i * 0.185, -0.42);
                    spineGroup.add(vert);
                    const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.04, 18), M.cart());
                    disc.position.set(0, 1.45 - i * 0.185 - 0.095, -0.42);
                    spineGroup.add(disc);
                    const proc = new THREE.Mesh(new THREE.CapsuleGeometry(0.03, 0.12, 4, 10), M.bone());
                    proc.rotation.x = 1.15; proc.position.set(0, 1.45 - i * 0.185, -0.58);
                    spineGroup.add(proc);
                }
                addPart(spineGroup, "Coluna vertebral", "Vértebras empilhadas com discos intervertebrais (amortecedores de cartilagem). Hérnias de disco ocorrem quando o disco comprime nervos.", [0, 1.75, -0.5], [0, 0.4, -1]);

                const ribs = new THREE.Group();
                for (let i = 0; i < 8; i++) {

                const clav = new THREE.Group();
                for (const side of [-1, 1]) {
                    clav.add(tube([[0.05 * side, 1.52, 0.48], [0.35 * side, 1.58, 0.42], [0.62 * side, 1.52, 0.22]], 0.035, M.bone(), 24));

                addPart(clav, "Clavículas", "Conectam o esterno às escápulas, estabilizando os ombros. São os ossos mais fraturados do corpo humano.", [0.7, 1.75, 0.3], [0.5, 1, 0.3]);

                return { camY: 0.8, scale: 1.0 };
            }

            const MODELS = {
                coracao: { label: "Coração", icon: "heart", build: buildHeart },
                cerebro: { label: "Cérebro", icon: "brain", build: buildBrain },
                pulmoes: { label: "Pulmões", icon: "lungs", build: buildLungs },
                torax: { label: "Tórax", icon: "bone", build: buildThorax },
            };

            let currentKey = "coracao";
            let labelsOn = true, xrayOn = false;
            let selected = null;
            const baseOpacity = new Map();

            function disposeGroup() {
                for (const p of parts) {
                    p.mesh.traverse?.((o) => {
                        if (o.isMesh) { o.geometry.dispose(); (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose()); }
                    });
                    if (p.mesh.isMesh) { p.mesh.geometry.dispose(); p.mesh.material.dispose(); }
                    group.remove(p.mesh);
                }
                parts = []; baseOpacity.clear(); selected = null;
                infoBox.classList.add("hidden");
            }

            const clipSlider = container.querySelector("[data-clip]");
            const explodeSlider = container.querySelector("[data-explode]");

            function loadModel(key) {
                disposeGroup();
                currentKey = key;
                const cfg = MODELS[key].build();
                group.scale.setScalar(cfg.scale);
                controls.target.set(0, cfg.camY, 0);
                camera.position.copy(HOME);
                clipSlider.value = "1.4"; clipPlane.constant = 1.4;
                explodeSlider.value = "0"; applyExplode(0);
                for (const p of parts) {
                    p.mesh.traverse?.((o) => { if (o.isMesh) baseOpacity.set(o.material, { opacity: o.material.opacity, transparent: o.material.transparent }); });
                    if (p.mesh.isMesh) baseOpacity.set(p.mesh.material, { opacity: p.mesh.material.opacity, transparent: p.mesh.material.transparent });
                }
                applyXray();
                renderModelButtons();
                buildLabels();
            }

            function renderModelButtons() {
                const box = container.querySelector("[data-models]");
                box.innerHTML = Object.entries(MODELS).map(([k, m]) =>
                    `<button data-model="${k}" class="inline-flex items-center justify-center gap-1.5 rounded-lg px-2 py-2 text-[11px] font-semibold ring-1 transition ${k === currentKey
                        ? "bg-med-600 text-white ring-med-500"
                        : "bg-white text-slate-600 ring-slate-200 hover:ring-med-400 dark:bg-slate-800 dark:text-slate-300 dark:ring-slate-700"
                    }">${ic(m.icon, "h-3.5 w-3.5")} ${m.label}</button>`).join("");
                box.querySelectorAll("[data-model]").forEach((b) => b.addEventListener("click", () => loadModel(b.dataset.model)));
            }

            function applyExplode(t) {
                for (const p of parts) p.mesh.position.copy(p.base).addScaledVector(p.dir, t * 0.85);
            }
            function applyXray() {
                for (const [mat, base] of baseOpacity) {
                    mat.transparent = xrayOn ? true : base.transparent;
                    mat.opacity = xrayOn ? Math.min(base.opacity, 0.3) : base.opacity;
                    mat.depthWrite = !mat.transparent;
                }
            }

            function select(part) {
                if (selected) setEmissive(selected.mesh, 0x000000);
                selected = part;
                if (part) {
                    setEmissive(part.mesh, 0x0f766e);
                    infoBox.classList.remove("hidden");
                    infoBox.innerHTML = `<p class="text-sm font-bold text-med-300">${part.name}</p>
        <p class="mt-1 text-xs leading-relaxed text-slate-200">${part.desc}</p>`;
                    onAnnounce?.(part.name);
                } else infoBox.classList.add("hidden");
                buildLabels();
            }
            function setEmissive(obj, hex) {
                obj.traverse?.((o) => { if (o.isMesh && o.material.emissive) o.material.emissive.setHex(hex); });
                if (obj.isMesh && obj.material.emissive) obj.material.emissive.setHex(hex);
            }

            const raycaster = new THREE.Raycaster();
            const pointer = new THREE.Vector2();
            renderer.domElement.addEventListener("pointerdown", (e) => {
                const rect = renderer.domElement.getBoundingClientRect();
                pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                raycaster.setFromCamera(pointer, camera);
                const meshes = [];
                for (const p of parts) { p.mesh.traverse?.((o) => { if (o.isMesh) { o.userData.part = p; meshes.push(o); } }); if (p.mesh.isMesh) { p.mesh.userData.part = p; meshes.push(p.mesh); } }
                const hits = raycaster.intersectObjects(meshes);
                select(hits.length ? hits[0].object.userData.part : null);
            });

            let labelEls = [];
            function buildLabels() {
                labelLayer.innerHTML = "";
                labelEls = [];
                if (!labelsOn) return;
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute("class", "absolute inset-0 h-full w-full");
                labelLayer.appendChild(svg);
                for (const p of parts) {
                    const el = document.createElement("button");
                    el.className = "hotspot" + (p === selected ? " active" : "");
                    el.textContent = p.name;
                    el.addEventListener("click", () => select(p));
                    labelLayer.appendChild(el);
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("stroke", p === selected ? "#14b8a6" : "rgba(20,184,166,.45)");
                    line.setAttribute("stroke-width", "1");
                    svg.appendChild(line);
                    labelEls.push({ part: p, el, line });
                }
            }
            const _wp = new THREE.Vector3(), _anchor = new THREE.Vector3();
            function updateLabels() {
                if (!labelsOn || !labelEls.length) return;
                const w = mount.clientWidth, h = mount.clientHeight;
                for (const { part, el, line } of labelEls) {
                    part.mesh.getWorldPosition(_anchor);
                    _wp.copy(_anchor).add(part.labelOffset.clone().multiplyScalar(group.scale.x)).project(camera);
                    const behind = _wp.z > 1;
                    const x = (_wp.x * 0.5 + 0.5) * w, y = (-_wp.y * 0.5 + 0.5) * h;
                    _anchor.project(camera);
                    const ax = (_anchor.x * 0.5 + 0.5) * w, ay = (-_anchor.y * 0.5 + 0.5) * h;
                    el.style.display = behind ? "none" : "";
                    line.style.display = behind ? "none" : "";
                    el.style.left = `${x}px`; el.style.top = `${y}px`;
                    line.setAttribute("x1", ax); line.setAttribute("y1", ay);
                    line.setAttribute("x2", x); line.setAttribute("y2", y);
                }
            }

            clipSlider.addEventListener("input", () => { clipPlane.constant = Number(clipSlider.value); });
            explodeSlider.addEventListener("input", () => applyExplode(Number(explodeSlider.value)));
            const onCls = "inline-flex items-center gap-1 rounded-lg bg-med-600 px-2.5 py-1.5 text-[11px] font-semibold text-white";
            const offCls = "inline-flex items-center gap-1 rounded-lg bg-slate-200 px-2.5 py-1.5 text-[11px] font-semibold text-slate-700 dark:bg-slate-700 dark:text-slate-200";
            container.querySelectorAll("[data-t]").forEach((btn) => btn.addEventListener("click", () => {
                const t = btn.dataset.t;
                if (t === "labels") { labelsOn = !labelsOn; btn.className = labelsOn ? onCls : offCls; buildLabels(); }
                if (t === "xray") { xrayOn = !xrayOn; btn.className = xrayOn ? onCls : offCls; applyXray(); }
                if (t === "rotate") { controls.autoRotate = !controls.autoRotate; btn.className = controls.autoRotate ? onCls : offCls; }
                if (t === "reset") {
                    camera.position.copy(HOME); clipSlider.value = "1.4"; clipPlane.constant = 1.4;
                    explodeSlider.value = "0"; applyExplode(0); select(null);
                }
            }));

            const onKey = (e) => {
                if (e.key === "ArrowLeft") camera.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), 0.15);
                if (e.key === "ArrowRight") camera.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), -0.15);
                if (e.key === "+" || e.key === "=") camera.position.multiplyScalar(0.92);
                if (e.key === "-") camera.position.multiplyScalar(1.08);
            };
            window.addEventListener("keydown", onKey);
            const onResize = () => {
                if (!mount.clientWidth) return;
                camera.aspect = mount.clientWidth / mount.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(mount.clientWidth, mount.clientHeight);
            };
            window.addEventListener("resize", onResize);

            loadModel("coracao");

            let raf = 0;
            (function animate() {
                raf = requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
                updateLabels();
            })();

            return {
                destroy() {
                    cancelAnimationFrame(raf);
                    window.removeEventListener("resize", onResize);
                    window.removeEventListener("keydown", onKey);
                    window.removeEventListener("mediia-theme", applySceneTheme);
                    disposeGroup();
                    pmrem.dispose();
                    controls.dispose();
                    renderer.dispose();
                },
            };
        }

        async function doctorCard(doctorId) {
            const doc = await dbGet("doctors", doctorId);
            const user = await dbGet("users", doc.userId);
            const spec = await dbGet("specialties", doc.specialtyId);
            return { ...doc, name: user.name, specialty: spec.name };
        }
        async function freeSlots(doctor, dateStr) {
            const weekday = new Date(`${dateStr}T12:00:00`).getDay();
            const avail = (await dbAllBy("availability", "doctorId", doctor.id)).filter((a) => a.weekday === weekday);
            const appts = (await dbAllBy("appointments", "doctorId", doctor.id)).filter((a) => a.status !== "cancelado");
            const booked = new Set(appts.map((a) => new Date(a.scheduledAt).getTime()));
            const slotMs = doctor.slotMinutes * 60000, out = [];
            for (const a of avail) {
                const start = new Date(`${dateStr}T${String(a.startHour).padStart(2, "0")}:00:00`).getTime();
                const end = new Date(`${dateStr}T${String(a.endHour).padStart(2, "0")}:00:00`).getTime();
                for (let t = start; t + slotMs <= end; t += slotMs) {
                    if (t <= Date.now() || booked.has(t)) continue;
                    out.push({ iso: new Date(t).toISOString(), label: new Date(t).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) });
                }
            }
            return out;
        }
        async function payAppointment(paymentId) {
            const payment = await dbGet("payments", paymentId);
            if (!payment || payment.status === "pago") return;
            await dbUpdate("payments", paymentId, { status: "pago", method: "pix", paidAt: nowISO() });
            await dbUpdate("appointments", payment.appointmentId, { status: "confirmado" });
            await dbAdd("notifications", { userId: payment.patientId, title: "Pagamento confirmado", body: "Sua consulta foi confirmada. Você receberá um lembrete antes do horário.", read: false, createdAt: nowISO() });
            await audit(payment.patientId, "payment.paid", "payments", paymentId);
        }
        async function cancelAppointment(appt, byUserId) {
            await dbUpdate("appointments", appt.id, { status: "cancelado" });
            const payment = await dbBy("payments", "appointmentId", appt.id);
            if (payment && payment.status === "pago") await dbUpdate("payments", payment.id, { status: "reembolsado" });
            await dbAdd("notifications", { userId: appt.patientId, title: "Consulta cancelada", body: "Sua consulta foi cancelada. Pagamentos realizados serão reembolsados.", read: false, createdAt: nowISO() });
            await audit(byUserId, "appointment.status:cancelado", "appointments", appt.id);
        }
        function apptActionsHTML(a, payment) {
            const parts = [];
            if (payment?.status === "pendente" && a.status === "solicitado")
                parts.push(`<button data-pay="${payment.id}" class="${C.chipP} bg-emerald-600 hover:bg-emerald-700">${ic("wallet", "h-3.5 w-3.5")} Pagar e confirmar</button>`);

            return parts.join("");
        }
        function bindApptActions(root, user, rerender) {
            root.querySelectorAll("[data-pay]").forEach((btn) => btn.addEventListener("click", async () => {

        /* ── Paciente: agendar ── */
        async function viewAgendar(root, { user }) {
            const specs = (await dbAll("specialties")).sort((a, b) => a.name.localeCompare(b.name));
            const state = { step: 1, spec: null, doctor: null, date: "", slot: null, reason: "" };
            root.innerHTML = shell(user, { title: "Agendar consulta", active: "#/paciente/agendar" }, `<div id="wizard" class="mx-auto max-w-3xl"></div>`);
            await bindShell(root, user);
            const box = () => root.querySelector("#wizard");

            async function draw() {
                const steps = ["Especialidade", "Médico", "Data e horário", "Confirmação"];
                let body = "";
                if (state.step === 1) {
                    body = `<div class="grid gap-3 sm:grid-cols-2">${specs.map((s) => `
        <button data-spec="${s.id}" class="${C.card} p-5 text-left transition hover:ring-med-400">

                } else if (state.step === 2) {
                    const ds = (await dbAllBy("doctors", "specialtyId", state.spec.id)).filter((d) => d.verified);
                    const enriched = await Promise.all(ds.map(async (d) => ({ ...d, user: await dbGet("users", d.userId) })));
                    body = `<button data-back="1" class="${C.link} mb-3 inline-flex items-center gap-1 text-sm">${ic("arrowLeft", "h-3.5 w-3.5")} Trocar especialidade (${esc(state.spec.name)})</button>
        ${enriched.length === 0 ? `<p class="${C.card} p-6 text-center text-sm ${C.tm}">Nenhum médico verificado nesta especialidade.</p>` : ""}
        <div class="space-y-3">${enriched.map((d) => `
          <button data-doctor="${d.id}" class="${C.card} flex w-full items-center gap-4 p-4 text-left transition hover:ring-med-400 sm:p-5">
            <span class="hidden h-12 w-12 items-center justify-center rounded-full bg-med-50 text-med-600 dark:bg-med-500/10 dark:text-med-400 sm:inline-flex">${ic("steth", "h-5 w-5")}</span>
            <div class="min-w-0 flex-1"><p class="font-bold ${C.h}">${esc(d.user.name)}</p>
              <p class="flex items-center gap-1 text-xs ${C.tm}">${esc(state.spec.name)} · CRM ${d.crm}/${d.uf} <span class="text-med-500">${ic("shield", "h-3 w-3")}</span></p>
              ${d.bio ? `<p class="mt-1 hidden text-xs ${C.tm} sm:block">${esc(d.bio)}</p>` : ""}</div>
            <div class="text-right"><p class="font-bold text-med-600 dark:text-med-400">${fmtBRL(d.priceCents)}</p><p class="text-[10px] ${C.tf}">${d.slotMinutes} min</p></div>
          </button>`).join("")}</div>`;
                } else if (state.step === 3) {
                    const today = new Date().toISOString().slice(0, 10);
                    const max = new Date(Date.now() + 60 * 864e5).toISOString().slice(0, 10);
                    const slots = state.date ? await freeSlots(state.doctor, state.date) : [];
                    body = `<div class="${C.card} space-y-4 p-5 sm:p-6">
        <button data-back="2" class="${C.link} inline-flex items-center gap-1 text-sm">${ic("arrowLeft", "h-3.5 w-3.5")} Trocar médico (${esc(state.doctor.userName)})</button>
        <div><label class="text-sm font-medium ${C.t}">Escolha a data</label>
          <input id="w-date" type="date" min="${today}" max="${max}" value="${state.date}" class="${C.input} sm:w-64" /></div>
        ${state.date ? `<div><p class="text-sm font-medium ${C.t}">Horários disponíveis</p>
          ${slots.length === 0 ? `<p class="mt-2 text-sm ${C.tf}">Nenhum horário livre (fins de semana não têm agenda). Tente outro dia.</p>`
                                : `<div class="mt-2 flex flex-wrap gap-2">${slots.map((s) => `<button data-slot="${s.iso}" class="rounded-lg px-3 py-2 text-sm font-medium ring-1 transition sm:px-4 ${state.slot?.iso === s.iso ? "bg-med-600 text-white ring-med-600" : `${C.soft} ${C.t} ring-slate-200 hover:ring-med-400 dark:ring-slate-700`}">${s.label}</button>`).join("")}</div>`}</div>` : ""}
        <button id="w-next" ${state.slot ? "" : "disabled"} class="${C.btnP}">Continuar</button>
      </div>`;
                } else if (state.step === 4) {
                    body = `<div class="${C.card} space-y-4 p-5 sm:p-6">
        <button data-back="3" class="${C.link} inline-flex items-center gap-1 text-sm">${ic("arrowLeft", "h-3.5 w-3.5")} Alterar horário</button>
        <div class="space-y-1 rounded-xl ${C.soft} p-4 text-sm ${C.t}">
          <p><strong class="${C.h}">Médico:</strong> ${esc(state.doctor.userName)} — ${esc(state.spec.name)}</p>
          <p><strong class="${C.h}">Quando:</strong> ${fmtDT(state.slot.iso)}</p>
          <p><strong class="${C.h}">Duração:</strong> ${state.doctor.slotMinutes} min · <strong class="${C.h}">Valor:</strong> ${fmtBRL(state.doctor.priceCents)}</p>
        </div>
        <div><label class="text-sm font-medium ${C.t}">Motivo da consulta</label>

        <p class="text-center text-xs ${C.tf}">A consulta só é confirmada com o pagamento aprovado.</p>
      </div>`;
                } else {
                    body = `<div class="${C.card} mx-auto max-w-lg p-8 text-center">
        <span class="mx-auto inline-flex h-14 w-14 items-center justify-center rounded-full bg-med-50 text-med-600 dark:bg-med-500/10 dark:text-med-400">${ic("checkCircle", "h-7 w-7")}</span>
        <h2 class="mt-3 text-xl font-bold ${C.h}">Consulta solicitada!</h2>
        <p class="mt-2 text-sm ${C.tm}">Sua consulta com <strong>${esc(state.doctor.userName)}</strong> foi solicitada para
        <strong>${fmtDT(state.slot.iso)}</strong>. Realize o pagamento em <strong>Minhas consultas</strong>.</p>

                box().innerHTML = `<div class="mb-5 flex items-center gap-2 overflow-x-auto pb-1 text-xs font-medium ${C.tm}">

        <span class="flex h-6 w-6 items-center justify-center rounded-full text-[11px] font-bold ${state.step > i ? "bg-med-600 text-white" : "bg-slate-200 text-slate-500 dark:bg-slate-700 dark:text-slate-400"}">${i + 1}</span>
        <span class="${state.step > i ? C.h : ""}">${label}</span>${i < 3 ? `<span class="${C.tf}">—</span>` : ""}</div>`).join("")}
    </div>${body}`;

                box().querySelectorAll("[data-spec]").forEach((b) => b.addEventListener("click", () => { state.spec = specs.find((s) => s.id === Number(b.dataset.spec)); state.step = 2; draw(); }));
                box().querySelectorAll("[data-doctor]").forEach((b) => b.addEventListener("click", async () => {

                box().querySelector("#w-date")?.addEventListener("change", (e) => { state.date = e.target.value; state.slot = null; draw(); });
                box().querySelectorAll("[data-slot]").forEach((b) => b.addEventListener("click", () => {
                    state.slot = { iso: b.dataset.slot, label: b.textContent.trim() }; draw();
                }));
                box().querySelector("#w-next")?.addEventListener("click", () => { if (state.slot) { state.step = 4; draw(); } });
                box().querySelector("#w-reason")?.addEventListener("input", (e) => { state.reason = e.target.value; });
                box().querySelector("#w-confirm")?.addEventListener("click", async () => {
                    const taken = (await dbAllBy("appointments", "doctorId", state.doctor.id))
                        .filter((a) => a.status !== "cancelado")
                        .some((a) => new Date(a.scheduledAt).getTime() === new Date(state.slot.iso).getTime());
                    if (taken) { toast("Este horário acabou de ser reservado. Escolha outro.", "error"); state.step = 3; state.slot = null; return draw(); }
                    const apptId = await dbAdd("appointments", { patientId: user.id, doctorId: state.doctor.id, scheduledAt: state.slot.iso, durationMin: state.doctor.slotMinutes, status: "solicitado", reason: state.reason || null, priceCents: state.doctor.priceCents, createdAt: nowISO() });
                    await dbAdd("payments", { appointmentId: apptId, patientId: user.id, amountCents: state.doctor.priceCents, status: "pendente", method: null, paidAt: null, createdAt: nowISO() });
                    await dbAdd("notifications", { userId: user.id, title: "Consulta solicitada", body: `Consulta solicitada para ${fmtDT(state.slot.iso)}. Realize o pagamento para confirmar.`, read: false, createdAt: nowISO() });
                    await dbAdd("notifications", { userId: state.doctor.userId, title: "Nova consulta solicitada", body: `Consulta solicitada para ${fmtDT(state.slot.iso)}.`, read: false, createdAt: nowISO() });
                    await audit(user.id, "appointment.create", "appointments", apptId);
                    state.step = 5; draw();
                });
            }
            await draw();

            const msgs = (await dbAllBy("aiMessages", "userId", user.id)).sort((a, b) => a.id - b.id).slice(-40);
            function drawLog() {
                log.innerHTML = msgs.length ? msgs.map(bubble).join("")

          <div class="flex aspect-video items-center justify-center" id="video-area">
            <div class="p-6 text-center sm:p-8">
              <span class="mx-auto inline-flex h-14 w-14 items-center justify-center rounded-full bg-slate-800 text-med-400">${ic("video", "h-6 w-6")}</span>
              <p class="mt-3 text-sm text-slate-400">Teste sua conexão: ative câmera e microfone.</p>
              <p id="media-error" class="mt-2 hidden max-w-md text-xs text-rose-400"></p>
              <button id="btn-media" class="mt-4 inline-flex items-center gap-2 rounded-xl bg-med-500 px-6 py-2.5 text-sm font-semibold text-slate-950 hover:bg-med-400">${ic("mic", "h-4 w-4")} Ativar câmera e microfone</button>
            </div>
          </div>
          <div class="absolute right-3 top-3 rounded-lg bg-slate-950/70 px-3 py-1.5 text-xs text-slate-300">${esc(otherName)} ${user.role === "doctor" ? "(paciente)" : "(médico)"}</div>
          <div id="media-controls" class="absolute bottom-3 left-1/2 hidden -translate-x-1/2 gap-3">
            <button id="btn-mic" class="flex h-11 w-11 items-center justify-center rounded-full bg-slate-700 text-white" title="Microfone">${ic("mic", "h-5 w-5")}</button>
            <button id="btn-cam" class="flex h-11 w-11 items-center justify-center rounded-full bg-slate-700 text-white" title="Câmera">${ic("video", "h-5 w-5")}</button>
          </div>
        </div>
        <div id="pane-3d" class="hidden rounded-2xl bg-slate-900 p-3 ring-1 ring-slate-800 sm:p-4">
          <p class="mb-3 text-xs text-slate-400">${user.role === "doctor"
                    ? "Clique em uma estrutura para destacá-la — o paciente é avisado no chat."
                    : "O médico pode destacar estruturas para explicar seu quadro. Explore livremente."}</p>
          <div id="room-viewer"><p class="p-6 text-center text-sm text-slate-500">O estúdio 3D carrega ao abrir esta aba.</p></div>
        </div>
      </div>
      <aside class="flex w-full flex-col rounded-2xl bg-slate-900 ring-1 ring-slate-800 lg:w-80">
        <p class="flex items-center gap-2 border-b border-slate-800 px-4 py-3 text-sm font-semibold">${ic("chat", "h-4 w-4 text-med-400")} Chat da consulta</p>
        <div id="room-chat" class="h-56 flex-1 space-y-2 overflow-y-auto p-3 sm:h-64 lg:h-auto">
          <p class="p-3 text-center text-xs text-slate-500">Use o chat para compartilhar informações ou como plano B em falha de conexão.</p>
        </div>
        <form id="room-form" class="flex gap-2 border-t border-slate-800 p-3">
          <input id="room-input" placeholder="Mensagem…" class="min-w-0 flex-1 rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-base text-white outline-none focus:border-med-500 sm:text-xs" />
          <button class="inline-flex items-center justify-center rounded-lg bg-med-500 px-3 py-2 text-slate-950 hover:bg-med-400" aria-label="Enviar">${ic("send", "h-3.5 w-3.5")}</button>
        </form>
      </aside>
    </div>
  </div>
  </div>`;

            let elapsed = 0, destroyed = false;
            const timerInt = setInterval(() => {
                elapsed++;
                const t = root.querySelector("#timer");
                if (t) t.textContent = `${String(Math.floor(elapsed / 60)).padStart(2, "0")}:${String(elapsed % 60).padStart(2, "0")}`;
            }, 1000);

            let stream = null, camOn = true, micOn = true;
            root.querySelector("#btn-media").addEventListener("click", async () => {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    const area = root.querySelector("#video-area");
                    area.innerHTML = "";
                    const video = document.createElement("video");
                    video.autoplay = true; video.muted = true; video.playsInline = true;
                    video.className = "h-full w-full object-cover";
                    video.srcObject = stream;
                    area.appendChild(video);
                    const mc = root.querySelector("#media-controls");
                    mc.classList.remove("hidden"); mc.classList.add("flex");
                } catch {
                    const err = root.querySelector("#media-error");
                    err.textContent = "Não foi possível acessar câmera/microfone. Verifique as permissões. Use o chat como alternativa.";
                    err.classList.remove("hidden");
                }
            });
            root.querySelector("#btn-mic").addEventListener("click", (e) => {
                if (!stream) return;
                micOn = !micOn;
                stream.getAudioTracks().forEach((t) => (t.enabled = micOn));
                const b = e.currentTarget;
                b.innerHTML = ic(micOn ? "mic" : "micOff", "h-5 w-5");
                b.className = `flex h-11 w-11 items-center justify-center rounded-full text-white ${micOn ? "bg-slate-700" : "bg-rose-600"}`;
            });
            root.querySelector("#btn-cam").addEventListener("click", (e) => {
                if (!stream) return;
                camOn = !camOn;
                stream.getVideoTracks().forEach((t) => (t.enabled = camOn));
                const b = e.currentTarget;
                b.innerHTML = ic(camOn ? "video" : "videoOff", "h-5 w-5");
                b.className = `flex h-11 w-11 items-center justify-center rounded-full text-white ${camOn ? "bg-slate-700" : "bg-rose-600"}`;
            });

            const chatBox = root.querySelector("#room-chat");
            const channel = new BroadcastChannel(`mediia_room_${appt.id}`);
            let lastId = 0;
            const drawMessages = (msgs) => {
                if (!msgs.length) return;
                chatBox.innerHTML = msgs.map((m) => `<div class="flex ${m.senderId === user.id ? "justify-end" : "justify-start"}">
      <div class="max-w-[85%] rounded-xl px-3 py-2 text-xs ${m.senderId === user.id ? "bg-med-600 text-white" : "bg-slate-800 text-slate-200"}">
        <p class="mb-0.5 text-[9px] opacity-70">${esc(m.senderName)}</p>${esc(m.content)}</div></div>`).join("");
                chatBox.scrollTop = chatBox.scrollHeight;
            };
            const loadMessages = async () => {
                if (destroyed) return;
                const msgs = (await dbAllBy("roomMessages", "appointmentId", appt.id)).sort((a, b) => a.id - b.id);
                if (msgs.length && msgs[msgs.length - 1].id !== lastId) { lastId = msgs[msgs.length - 1].id; drawMessages(msgs); }
            };
            await loadMessages();
            channel.onmessage = loadMessages;
            const pollInt = setInterval(loadMessages, 3000);
            async function sendMessage(text) {
                if (destroyed) return;
                const content = text.trim();
                if (!content) return;
                await dbAdd("roomMessages", { appointmentId: appt.id, senderId: user.id, senderName: user.name, content, createdAt: nowISO() });
                try { channel.postMessage("new"); } catch { }
                await loadMessages();
            }
            root.querySelector("#room-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const input = root.querySelector("#room-input");
                sendMessage(input.value);
                input.value = "";
            });

            let viewer = null;
            const tabVideo = root.querySelector("#tab-video"), tab3d = root.querySelector("#tab-3d");
            const setTab = async (which) => {
                const active = "inline-flex items-center gap-1.5 rounded-lg bg-med-500 px-4 py-2 text-sm font-medium text-slate-950";
                const idle = "inline-flex items-center gap-1.5 rounded-lg bg-slate-800 px-4 py-2 text-sm font-medium text-slate-300";
                tabVideo.className = which === "video" ? active : idle;
                tab3d.className = which === "3d" ? active : idle;
                root.querySelector("#pane-video").classList.toggle("hidden", which !== "video");
                root.querySelector("#pane-3d").classList.toggle("hidden", which !== "3d");
                if (which === "3d" && !viewer) {
                    try {
                        viewer = await mountAnatomyPro(root.querySelector("#room-viewer"), {
                            compact: true,
                            forceDark: true,
                            onAnnounce: (name) => { if (user.role === "doctor") sendMessage(`[3D] Estou destacando: ${name}`); },
                        });
                    } catch { root.querySelector("#room-viewer").innerHTML = `<p class="p-6 text-center text-sm text-amber-300">Falha ao carregar o Three.js.</p>`; }
                }
            };
            tabVideo.addEventListener("click", () => setTab("video"));
            tab3d.addEventListener("click", () => setTab("3d"));

            window.__viewCleanup = () => {
                destroyed = true;
                clearInterval(timerInt);
                clearInterval(pollInt);
                channel.close();
                stream?.getTracks().forEach((t) => t.stop());
                viewer?.destroy();
            };
        }

        /* ── Estúdio 3D (página cheia) + verificador ── */
        async function view3D(root) {
            const user = await currentUser();
            const back = user ? homeFor(user) : "#/";
            root.innerHTML = `
  <div class="min-h-screen fade-in">
    <header class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-5 sm:px-6">
      <a href="#/">${logoHTML()}</a>
      <div class="flex items-center gap-2">
        ${themeBtnHTML()}
        <a href="${back}" class="${C.btnSec}">${ic("arrowLeft")} Voltar</a>
      </div>
    </header>
    <main class="mx-auto max-w-6xl space-y-6 px-4 pb-16 sm:px-6">
      <div>
        <h1 class="text-xl font-extrabold ${C.h} sm:text-2xl">Estúdio de anatomia 3D</h1>
        <p class="mt-1 text-sm ${C.tm}">
          Troque entre coração, cérebro, pulmões e tórax ósseo. Use o <strong>corte seccional</strong> para ver o
          interior, a <strong>vista explodida</strong> para separar as estruturas, o <strong>raio-X</strong> para
          transparência e clique nas <strong>etiquetas</strong> para descrições educativas.
        </p>
      </div>
      <div class="${C.card} p-3 sm:p-4 md:p-6">
        <div id="full-viewer"><p class="p-10 text-center text-sm ${C.tf}">Carregando estúdio 3D…</p></div>
      </div>
      <div class="grid gap-4 sm:grid-cols-2 md:grid-cols-3">
        <div class="${C.card} p-5"><span class="inline-flex gap-1 text-med-500">${ic("scissors")}${ic("layers")}${ic("scan")}</span>
          <h3 class="mt-2 font-bold ${C.h}">Ferramentas de estudo</h3>
          <p class="mt-1 text-xs ${C.tm}">Corte seccional por plano, vista explodida com separação das peças e modo raio-X translúcido.</p></div>
        <div class="${C.card} p-5"><span class="text-med-500">${ic("tag")}</span>
          <h3 class="mt-2 font-bold ${C.h}">Etiquetas com linha-guia</h3>
          <p class="mt-1 text-xs ${C.tm}">Cada estrutura tem etiqueta clicável conectada por linha-guia, com descrição educativa.</p></div>
        <div class="${C.card} p-5"><span class="text-med-500">${ic("scan")}</span>
          <h3 class="mt-2 font-bold ${C.h}">Exames (DICOM)</h3>
          <p class="mt-1 text-xs ${C.tm}">Tomografias e ressonâncias com reconstrução volumétrica são roadmap — exigem PACS e validação regulatória.</p></div>
      </div>
      <p class="flex items-center justify-center gap-2 rounded-xl bg-amber-50 p-3 text-center text-xs text-amber-800 ring-1 ring-amber-200 dark:bg-amber-500/10 dark:text-amber-300 dark:ring-amber-500/20">
        ${ic("alert", "h-3.5 w-3.5")} Modelos educativos gerados proceduralmente. Não representam a anatomia individual de nenhum paciente.
      </p>
    </main>
  </div>`;
            bindTheme(root);
            try {
                const viewer = await mountAnatomyPro(root.querySelector("#full-viewer"));
                window.__viewCleanup = () => viewer.destroy();
            } catch (e) {
                console.error(e);
                root.querySelector("#full-viewer").innerHTML = `<p class="p-10 text-center text-sm text-amber-600 dark:text-amber-300">Não foi possível carregar o Three.js (CDN).</p>`;
            }
        }

        async function viewVerificar(root) {
            root.innerHTML = `
  <div class="flex min-h-screen items-center justify-center px-4 fade-in">
    <div class="w-full max-w-md">
      <div class="mb-8 flex items-center justify-between">
        <a href="#/">${logoHTML()}</a>${themeBtnHTML()}
      </div>
      <div class="${C.card} p-6 sm:p-8">
        <h1 class="flex items-center gap-2 text-xl font-bold ${C.h}">${ic("shield", "h-5 w-5 text-med-500")} Verificar autenticidade</h1>
        <p class="mt-1 text-sm ${C.tm}">Digite o código impresso no documento. Nenhum conteúdo clínico é exibido.</p>
        <form id="vf" class="mt-5 flex gap-2">
          <input id="vc" placeholder="MED-XXXXX-XXXXXX" class="${C.input} mt-0 flex-1 font-mono" />
          <button class="${C.btnP}">Verificar</button>
        </form>
        <div id="vr" class="mt-5 hidden rounded-xl p-4 text-sm"></div>
      </div>
    </div>
  </div>`;
            bindTheme(root);
            root.querySelector("#vc").addEventListener("input", (e) => { e.target.value = e.target.value.toUpperCase(); });
            root.querySelector("#vf").addEventListener("submit", async (e) => {
                e.preventDefault();
                const code = root.querySelector("#vc").value.trim().toUpperCase();
                const box = root.querySelector("#vr");
                box.classList.remove("hidden");
                const doc = code ? await dbBy("documents", "code", code) : null;
                if (!doc || doc.status !== "emitido") {
                    box.className = "mt-5 rounded-xl p-4 text-sm bg-rose-50 text-rose-900 ring-1 ring-rose-200 dark:bg-rose-950/50 dark:text-rose-200 dark:ring-rose-800";
                    box.innerHTML = `<p class="font-bold">Documento não encontrado ou cancelado.</p>`;
                    return;
                }
                const doctor = await dbGet("doctors", doc.doctorId);
                const du = await dbGet("users", doctor.userId);
                box.className = "mt-5 rounded-xl p-4 text-sm bg-emerald-50 text-emerald-900 ring-1 ring-emerald-200 dark:bg-emerald-950/50 dark:text-emerald-200 dark:ring-emerald-800";
                box.innerHTML = `<p class="flex items-center gap-1.5 font-bold">${ic("checkCircle", "h-4 w-4")} Documento autêntico</p>
      <p class="mt-1">Tipo: ${esc(doc.type)}</p>
      <p>Emitido por: ${esc(du.name)} — CRM ${doctor.crm}/${doctor.uf}</p>
      <p>Data: ${fmtDT(doc.createdAt)}</p>`;
            });
        }

        /* ═══ 12. ROTEADOR ═══════════════════════════════════════════════════ */
        const routes = {
            "": { render: viewLanding },
            "login": { render: viewLogin },
            "registro": { render: viewRegister },
            "registro-medico": { render: viewRegisterDoctor },
            "3d": { render: view3D },
            "verificar": { render: viewVerificar },
            "paciente": { render: viewPatientDash, role: "patient" },
            "paciente/agendar": { render: viewAgendar, role: "patient" },
            "paciente/consultas": { render: viewConsultas, role: "patient" },
            "paciente/documentos": { render: viewDocumentos, role: "patient" },
            "paciente/pagamentos": { render: viewPagamentos, role: "patient" },
            "paciente/assistente": { render: viewAssistente, role: "patient" },
            "paciente/perfil": { render: viewPerfil, role: "patient" },
            "medico": { render: viewMedico, role: "doctor" },
            "medico/consulta": { render: viewProntuario, role: "doctor" },
            "admin": { render: viewAdmin, role: "admin" },
            "suporte": { render: viewSupport, role: "support" },
            "sala": { render: viewSala, auth: true },
        };

        async function navigate() {
            const app = document.getElementById("app");
            if (window.__viewCleanup) { try { window.__viewCleanup(); } catch { } window.__viewCleanup = null; }
            const raw = location.hash.replace(/^#\/?/, "");
            const [path, qs] = raw.split("?");
            const params = Object.fromEntries(new URLSearchParams(qs || ""));
            const route = routes[path] ?? routes[""];
            const user = await currentUser();
            if (route.role && (!user || user.role !== route.role)) { location.hash = homeFor(user); return; }
            if (route.auth && !user) { location.hash = "#/login"; return; }
            app.innerHTML = `<div class="flex min-h-screen items-center justify-center text-slate-400">Carregando…</div>`;
            try {
                await route.render(app, { params, user });
                window.scrollTo(0, 0);
            } catch (err) {
                console.error("[MediIA] erro na rota:", err);
                app.innerHTML = `<div class="flex min-h-screen items-center justify-center p-6">
      <div class="${C.card} max-w-md p-8 text-center">
        <span class="mx-auto inline-flex h-12 w-12 items-center justify-center rounded-full bg-rose-50 text-rose-500 dark:bg-rose-950/50">${ic("alert", "h-6 w-6")}</span>
        <h1 class="mt-3 text-lg font-bold ${C.h}">Algo deu errado</h1>
        <p class="mt-2 text-sm ${C.tm}">${esc(err?.message ?? "Erro inesperado.")}</p>
        <a href="#/" class="${C.btnP} mt-4">Voltar ao início</a>
      </div></div>`;
            }
        }

        window.addEventListener("hashchange", navigate);
        (async () => {
            try {
                await openDB();
                await ensureSeed();
            } catch (e) {
                console.error("[MediIA] falha ao abrir IndexedDB:", e);
            }
            navigate();
        })();
    </script>
</body>

</html>
